<section class="for-you-catalogue py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0">For you</h2>
    </div>

    <div class="row g-4">
        {% for product in products %}
            <div class="col-sm-6 col-lg-3">
                {% include "customer/components/product_card.html" with product=product only %}
            </div>
        {% empty %}
            <div class="col-12">
                <p class="text-muted">
                    No eligible products currently match your
                    {{ style_profile.predicted_style.display_name }}
                    style.
                </p>

                <a href="{% url 'customer:style_preferences' %}"
                   class="btn btn-outline-dark">
                    Update preferences
                </a>
            </div>
        {% endfor %}
    </div>
</section>
