<header class="for-you-header">
    <div class="for-you-header-content">
        <h1 class="for-you-title">Find your next rental</h1>

        <p class="for-you-description">
            See clothing based on your
            <strong>{{ style_profile.predicted_style.display_name }}</strong>
            preferences and the products you interact with.
        </p>

        <div class="for-you-actions">
            <a href="{% url 'customer:catalogue' %}"
               class="btn btn-dark for-you-primary-action">
                Browse all clothing
            </a>

            <a href="{% url 'customer:style_preferences' %}"
               class="btn for-you-preferences">
                Change preferences
            </a>
        </div>
    </div>
</header>
