<div class="{{ column_class|default:'col-12 col-sm-6 col-xl-4' }}">
    <article class="card metric-card metric-card--{{ tone|default:'neutral' }} h-100">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-start gap-3">
                <div>
                    <p class="metric-card__label mb-2">
                        {{ label }}
                    </p>

                    <p class="metric-card__value mb-0">
                        {% if prefix %}
                            <span class="metric-card__prefix">{{ prefix }}</span>
                        {% endif %}
                        {{ value }}
                    </p>
                </div>

                {% if icon %}
                    <span class="metric-card__icon" aria-hidden="true">
                        <i class="bi {{ icon }}"></i>
                    </span>
                {% endif %}
            </div>

            {% if description %}
                <p class="small text-muted mt-3 mb-0">
                    {{ description }}
                </p>
            {% endif %}
        </div>
    </article>
</div>
